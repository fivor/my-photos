name = "photo-gallery-worker"
main = "api/index.ts"
compatibility_date = "2024-01-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "photo-gallery"
preview_bucket_name = "photo-gallery-preview"

[vars]
SITE_TITLE = "My Photo Gallery"
# Note: ADMIN_PASSWORD, VISITOR_PASSWORD, and JWT_SECRET should be set as secrets in Cloudflare dashboard
